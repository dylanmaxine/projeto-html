<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos</title>
</head>
<body>
    <h1>Cursos</h1>
    <p>Descubra nossos cursos e programas de capacitação:</p>
    <ul>
        <label for="cursos">Selecione um curso:</label>
        <input type="text" id="cursos" name="cursos" placeholder="Digite o nome do curso">
        <li>Curso de Programação Web</li>
        <li>Curso de Informática Básica</li>
        <li>Programa de Empreendedorismo</li>
        <li>Workshop de Liderança</li>
        <li>Curso de Desenvolvimento Pessoal</li>
        <li>Curso de Habilidades Sociais</li>
        
    </ul>  
    
<h2>Inscreva-se em nossos cursos:</h2>
    <form action="inscricao.html" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="curso">Curso de interesse:</label>
        <select id="curso" name="curso" required>
            <option value="">Selecione um curso</option>
            <option value="programacao">Curso de Programação Web</option>
            <option value="informatica">Curso de Informática Básica</option>
            <option value="empreendedorismo">Programa de Empreendedorismo</option>
            <option value="lideranca">Workshop de Liderança</option>
            <option value="desenvolvimento">Curso de Desenvolvimento Pessoal</option>
            <option value="habilidades">Curso de Habilidades Sociais</option>
        </select><br><br>
        
        <input type="submit" value="Inscrever-se">
    </form>


</body>
</html>
